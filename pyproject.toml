[project]
name = "emporio-da-musica-ai"
version = "0.1.0"
description = "Customer service agent for the fictional store Empório da Música"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.21.4",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "emporio"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pandas>=3.1.0",
    "pytest>=9.2.0",
]
